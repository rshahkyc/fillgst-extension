<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FillGST Helper — Settings</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 32px;
        max-width: 640px;
        background: #1a1a1a;
        color: #e8e8e8;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 24px;
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 4px;
        color: #aaa;
      }
      input[type="text"] {
        width: 100%;
        padding: 8px 10px;
        background: #262626;
        border: 1px solid #404040;
        border-radius: 6px;
        color: #fff;
        font-size: 13px;
        font-family: monospace;
        box-sizing: border-box;
      }
      .field {
        margin-bottom: 20px;
      }
      .help {
        font-size: 11px;
        color: #777;
        margin-top: 4px;
      }
      button {
        background: #d75a2c;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
      }
      button:hover {
        background: #c04d22;
      }
      .saved {
        color: #4ade80;
        font-size: 12px;
        margin-left: 12px;
      }
      .logo {
        display: inline-flex;
        width: 22px;
        height: 22px;
        background: #d75a2c;
        color: white;
        font-weight: 700;
        font-size: 11px;
        align-items: center;
        justify-content: center;
        border-radius: 5px;
        vertical-align: middle;
        margin-right: 8px;
      }
      h1 {
        display: flex;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <h1><span class="logo">FG</span>FillGST Helper — Settings</h1>
    <div class="field">
      <label for="serverUrl">FillGST server URL</label>
      <input
        type="text"
        id="serverUrl"
        placeholder="https://fillgst.com"
      />
      <div class="help">
        The URL where FillGST is hosted. Defaults to the cloud
        (<code>https://fillgst.com</code>); set this only if you&apos;re
        running FillGST on your office LAN, e.g. <code>http://192.168.1.24:3000</code>.
      </div>
    </div>
    <div>
      <button id="save">Save</button>
      <span class="saved" id="saved" style="display: none">Saved ✓</span>
    </div>
    <script type="module" src="options.ts"></script>
  </body>
</html>
